name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install via quickstart.sh
        run: bash ./quickstart.sh --no-systemd --no-siblings --yes
      - name: Install dev extras (ruff)
        run: pip install -e '.[dev]'
      - name: Ruff lint
        run: ruff check src/ tests/

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install via quickstart.sh
        run: bash ./quickstart.sh --no-systemd --no-siblings --yes
      - name: Install dev extras (pytest)
        run: pip install -e '.[dev]'
      - name: Install frontend browser dependencies
        run: npm ci
      - name: Install Playwright Firefox
        run: npx playwright install --with-deps firefox
      - name: Validate frontend script syntax
        run: node --check src/sage_faculty_twin/web/app.js
      - name: Frontend contract test
        run: python -m pytest tests/test_frontend_contract.py -q
      - name: Multi-viewport browser regression test
        run: npm run test:browser
      - name: Upload visual baselines and failure diffs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: theme-release-gate
          if-no-files-found: ignore
          path: |
            tests/browser/*-snapshots/*.png
            test-results/**/*.png
            test-results/**/*.zip

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Initialize shared deployment receipt contract
        run: |
          git config --global url."https://github.com/".insteadOf git@github.com:
          git submodule update --init deps/vllm-hust-dev-hub
      - name: Install OS test dependencies
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install via quickstart.sh
        run: bash ./quickstart.sh --no-systemd --no-siblings --yes
      - name: Install dev extras (pytest, pytest-asyncio)
        run: pip install -e '.[dev]'
      - name: Run test suite
        env:
          PYTHONPATH: src
          DIGITAL_TWIN_NEUROMEM_INDEX_TYPE: segment
          DIGITAL_TWIN_CONVERSATION_MEMORY_INDEX_TYPE: segment
        run: |
          python -m pytest tests/ -q --tb=short \
            --ignore=tests/test_sagevdb_knowledge_store.py \
            --ignore=tests/test_identity_eval.py

  install-linux-cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install OS test dependencies
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify one-command Linux CPU install path
        env:
          FACULTY_TWIN_PARENT_DIR: ${{ runner.temp }}/sage-cpu-parent
          DIGITAL_TWIN_RUNTIME_DIR: ${{ runner.temp }}/sage-cpu-parent/sage-mate-runtime-private
          FACULTY_TWIN_VENV: ${{ runner.temp }}/sage-cpu-venv
          PIP_INSTALL_TIMEOUT_SECONDS: "300"
        run: |
          bash ./quickstart.sh \
            --target hosted-web \
            --no-systemd \
            --no-siblings \
            --skip-vdb-extras \
            --yes
          test -f "$FACULTY_TWIN_PARENT_DIR/sage-mate-runtime-private/data/workflow_policies/faculty-default-2026-05.json"
          test -f "$FACULTY_TWIN_PARENT_DIR/sage-mate-runtime-private/data/workflow_scenarios/v3_preview_scenarios.json"
          test -f "$FACULTY_TWIN_PARENT_DIR/sage-mate-runtime-private/data/capability_plugins/course_advising.json"

  validate-linux-ascend:
    # GitHub-hosted runners do not have Ascend NPUs. Keep this job hardware
    # independent; real NPU deployment remains an explicitly managed host
    # verification step outside the pull-request gate.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Ascend launcher shell syntax
        run: |
          bash -n tools/run_vllm_engine.sh
          bash -n tools/lock_sage_mate_engine.sh
          bash -n tools/verify_sage_mate_engine.sh
          bash -n tools/retry_deploy_vllm_ascend_until_success.sh
      - name: Validate Ascend deployment contract
        run: |
          grep -q 'VLLM_ENGINE_HOST_VISIBLE_NPU_DEVICES' tools/run_vllm_engine.sh
          grep -q 'VLLM_ENGINE_RUNTIME_VISIBLE_DEVICES' tools/run_vllm_engine.sh
          grep -q 'VLLM_ENGINE_ENFORCE_EAGER=0' tools/lock_sage_mate_engine.sh
          grep -q '/health' tools/verify_sage_mate_engine.sh
          awk '
            BEGIN { invalid = 0 }
            /^[[:space:]]*runs-on:/ && /self-hosted/ { invalid = 1 }
            END { exit invalid }
          ' .github/workflows/ci.yml
